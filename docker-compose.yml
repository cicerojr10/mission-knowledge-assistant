services:
  postgres:
    image: postgres:16
    container_name: mission_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mission_knowledge
      POSTGRES_USER: mission_user
      POSTGRES_PASSWORD: mission_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
